<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CakGo 음성 및 API 테스트</title>
<style>body{font:18px system-ui;max-width:720px;margin:32px auto;padding:16px}button,input,select{font:inherit;padding:12px;margin:6px}button{min-height:48px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#status{padding:20px;background:#eef4fa}</style>
<h1>CakGo 백엔드와 음성 테스트</h1>
<p>이 페이지는 Member 3 통합 테스트용입니다. 기본 mock 모드는 사진을 실제로 인식하지 않습니다.</p>
<button id="enable">음성 안내 시작</button><button id="stop">음성 안내 중지</button>
<p id="status" role="status" aria-live="polite">시작 버튼을 누른 후 테스트하세요.</p>
<p>모의 음성 결과:</p>
<button data-position="left">왼쪽</button><button data-position="center">가운데</button><button data-position="right">오른쪽</button><button data-position="missing">보이지 않음</button>
<h2>이미지 업로드 API 테스트</h2>
<form id="form"><label>찾을 물건 <input name="target" value="keys" required maxlength="100"></label><br>
<label>JPEG 또는 PNG <input name="image" type="file" accept="image/jpeg,image/png" required></label><br>
<button id="submit" type="submit">검사 요청</button></form><p id="mode"></p><pre id="result"></pre>
<script src="/voice/guidance.js"></script><script>
const status = document.getElementById('status');
const voice = new CakGoVoice({onStatus: text => {status.textContent = text;}});
document.getElementById('enable').onclick = () => voice.enable();
document.getElementById('stop').onclick = () => {voice.stop(); status.textContent = '음성 안내가 중지되었습니다.';};
document.querySelectorAll('[data-position]').forEach(button => button.onclick = () => voice.guide({target:'keys',detected:button.dataset.position !== 'missing',position:button.dataset.position}));
document.getElementById('form').onsubmit = async event => {
  event.preventDefault(); document.getElementById('submit').disabled = true;
  try {
    const response = await fetch('/api/detect', {method:'POST',body:new FormData(event.target),signal:AbortSignal.timeout(120000)});
    const data = await response.json();
    document.getElementById('result').textContent = JSON.stringify(data,null,2);
    document.getElementById('mode').textContent = `서버 모드: ${response.headers.get('X-CakGo-Detector') || '확인 필요'}`;
    if (!response.ok) throw new Error(data.error);
    voice.guide(data);
  } catch (error) { document.getElementById('result').textContent = error.message; voice.error('network'); }
  finally { document.getElementById('submit').disabled = false; }
};
</script></html>
