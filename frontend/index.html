<body>

    <h1>CakGo</h1>

    <h2>AI Object Finder</h2>

    <p>Find your objects using your smartphone camera.</p>

 
<div style="margin: 20px auto; max-width: 350px;">
    <label for="targetObject" style="font-size: 20px;">
        What are you looking for?
    </label>

    <select id="targetObject"
            style="width: 100%; padding: 15px;
                   font-size: 20px; margin-top: 10px;
                   border-radius: 10px;">
        <option value="cup">Cup</option>
        <option value="phone">Phone</option>
        <option value="keys">Keys</option>
        <option value="book">Book</option>
        <option value="bottle">Bottle</option>
    </select>
</div>
  
<button id="startBtn">Start Camera</button>
<button id="stopBtn">Stop Camera</button>

<div class="viewer">
    <video id="camera" autoplay playsinline muted
           style="width:100%;border-radius:12px;background:#222;">
    </video>
    <svg id="boxes" class="boxes" preserveAspectRatio="none" aria-hidden="true"></svg>
</div>

<p id="status" role="status" aria-live="polite">
    Camera is not started.
</p>

<p id="result" class="result" lang="ko" role="status" aria-live="polite"></p>

<p id="mode" hidden>
    Test mode: the server returns fixed mock boxes, not real detection.
</p>

<script>
    const video = document.getElementById("camera");
    const statusText = document.getElementById("status");
    let stream = null;

    // Detection: send one frame at a time to the backend and draw the boxes it returns.
    const DETECT_URL = "/api/detect";  // same origin; dev_server.py forwards it to the backend
    const MAX_SIDE = 1280;             // long side of the uploaded JPEG, in pixels
    const PAUSE_MS = 1000;             // provisional: pause after each answer, so ≤ 1 request/s
    const TIMEOUT_MS = 30000;          // Grounding DINO on CPU takes about 15 s per frame
    const targetSelect = document.getElementById("targetObject");
    const boxes = document.getElementById("boxes");
    const resultText = document.getElementById("result");
    const modeText = document.getElementById("mode");
    const canvas = document.createElement("canvas");
    let scanId = 0;  // bumped on start/stop so a late answer from an old scan is dropped

    function setText(element, text) {
        if (element.textContent !== text) {  // unchanged text is not announced again
            element.textContent = text;
        }
    }

    function clearResult() {
        boxes.replaceChildren();
        setText(resultText, "");
    }

    function captureFrame() {
        const scale = Math.min(1, MAX_SIDE / Math.max(video.videoWidth, video.videoHeight));
        canvas.width = Math.round(video.videoWidth * scale);
        canvas.height = Math.round(video.videoHeight * scale);
        canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
        return new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.85));
    }

    async function requestDetection(image, target) {
        const form = new FormData();
        form.append("image", image, "frame.jpg");
        form.append("target", target);
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
        try {
            const response = await fetch(DETECT_URL,
                {method: "POST", body: form, signal: controller.signal});
            const data = await response.json().catch(() => ({}));
            return {response, data};
        } finally {
            clearTimeout(timer);
        }
    }

    // Voice guidance (voice/guidance.js) can hook in here with voice.guide(result).
    function showResult(result) {
        boxes.setAttribute("viewBox", `0 0 ${result.image_width} ${result.image_height}`);
        boxes.replaceChildren(...result.detections.map((detection, index) => {
            const [x1, y1, x2, y2] = detection.bbox;
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("x", x1);
            rect.setAttribute("y", y1);
            rect.setAttribute("width", x2 - x1);
            rect.setAttribute("height", y2 - y1);
            if (index === 0) {
                rect.classList.add("best");  // highest confidence; the guidance is based on it
            }
            return rect;
        }));
        setText(resultText, result.message);
        setText(statusText, "Camera is running.");
    }

    function showError(message) {
        clearResult();
        setText(statusText, message);
    }

    async function detectOnce(id) {
        const target = targetSelect.value;
        try {
            const {response, data} = await requestDetection(await captureFrame(), target);
            if (id !== scanId || target !== targetSelect.value) {
                return;  // stopped, or another target was chosen meanwhile
            }
            modeText.hidden = response.headers.get("X-CakGo-Detector") !== "mock";
            if (response.ok) {
                showResult(data);
            } else {
                showError(data.error || `Server error (${response.status}).`);
            }
        } catch (error) {
            if (id === scanId) {
                showError(error.name === "AbortError"
                    ? "The server took too long to answer." : "Cannot reach the server.");
            }
        }
    }

    async function scan(id) {
        while (id === scanId) {
            if (video.videoWidth) {  // 0 until the camera delivers frames
                await detectOnce(id);
            }
            await new Promise(resolve => setTimeout(resolve, PAUSE_MS));
        }
    }

    targetSelect.onchange = clearResult;

    document.getElementById("startBtn").onclick = async function() {
        try {
            if (!navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia) {
                statusText.textContent =
                    "Camera requires a secure connection.";
                return;
            }

            if (stream) {
                scanId++;  // the old scan must not keep sending the last frozen frame
                clearResult();
                stream.getTracks().forEach(track => track.stop());
            }

            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            });

            video.srcObject = stream;
            statusText.textContent = "Camera is running.";
            clearResult();
            scan(++scanId);
        } catch (error) {
            statusText.textContent =
                "Cannot open camera. Check camera permission.";
            console.error(error);
        }
    };

    document.getElementById("stopBtn").onclick = function() {
        scanId++;
        clearResult();
        modeText.hidden = true;
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
        video.srcObject = null;
        statusText.textContent = "Camera stopped.";
    };
</script>


</body>
